name: Chat quality checks

on:
  push:
    branches:
      - hardening/chat-opa-api
  pull_request:
    paths:
      - "wp-content/themes/VictorTech/**"
      - ".github/workflows/chat-quality.yml"

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["7.4", "8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP theme files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find wp-content/themes/VictorTech -type f -name '*.php' -print)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            php -l "$file"
          done

  javascript-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check chat JavaScript syntax
        run: node --check wp-content/themes/VictorTech/assets/chat/chat.js
